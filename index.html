<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar Quest</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1a1712">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-apple-touch.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grammar Quest">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#f8f8f0; --ink:#202020; --accent-gold:#f2c94c;
    --stone-hi:#948972; --stone-dark:#1a1712; --stone-mid:#3b352a;
    --accent-correct:#4fd870; --accent-wrong:#e6553f;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; background:#000; }
  body{
    font-family:'VT323', monospace; color:var(--parchment);
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    -webkit-font-smoothing:none;
  }
  button{ font-family:inherit; }
  #app{
    width:100%; max-width:480px; height:100%; max-height:860px;
    position:relative; background:#0a0810; overflow:hidden;
    border-left:3px solid #000; border-right:3px solid #000;
    display:flex; flex-direction:column;
  }

  .screen{ position:absolute; inset:0; display:none; flex-direction:column; overflow:hidden; }
  .screen.active{ display:flex; }

  /* ============ SHARED STATUS BAR ============ */
  #status-bar{
    background:#15121c; border-bottom:3px solid var(--stone-hi);
    padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top,0px));
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    z-index:6; font-size:16px; flex:none;
  }
  #status-bar .hero-tag{ font-family:'Press Start 2P', monospace; font-size:10px; color:var(--accent-gold); white-space:nowrap; }
  #status-bar .hearts{ display:flex; gap:3px; font-size:15px; }
  #status-bar .status-right{ display:flex; align-items:center; gap:10px; }
  #status-bar .gold{ color:var(--accent-gold); white-space:nowrap; }
  .icon-btn{
    background:none; border:2px solid var(--stone-hi); color:var(--parchment);
    border-radius:6px; padding:4px 7px; font-size:15px; cursor:pointer; line-height:1;
  }

  /* ============ TITLE ============ */
  #screen-title{ align-items:center; justify-content:center; text-align:center; gap:26px; padding:20px; }
  #stars{ position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(2px 2px at 15% 12%, #fff, transparent),
      radial-gradient(1px 1px at 75% 8%, #fff, transparent),
      radial-gradient(1px 1px at 40% 20%, #fff, transparent),
      radial-gradient(2px 2px at 85% 30%, #fff, transparent),
      radial-gradient(1px 1px at 55% 6%, #fff, transparent),
      radial-gradient(1px 1px at 25% 35%, #fff, transparent);
    opacity:.6;
  }
  #logo-emblem{
    width:84px; height:84px; display:flex; align-items:center; justify-content:center; font-size:40px;
    background:radial-gradient(circle at 40% 35%, #4a3f6b, #1a1712 70%);
    border:3px solid var(--accent-gold); border-radius:50%;
    box-shadow:0 0 22px rgba(242,201,76,.35), inset 0 0 12px rgba(0,0,0,.6);
  }
  #logo-title{ font-family:'Press Start 2P', monospace; font-size:26px; line-height:1.5; color:var(--accent-gold); text-shadow:3px 3px 0 #000; }
  #logo-sub{ font-family:'Press Start 2P', monospace; font-size:10px; color:#b8ac8e; letter-spacing:1px; }
  #tap-start{ font-family:'Press Start 2P', monospace; font-size:11px; margin-top:10px; animation:blink 1.3s step-start infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ============ SLOTS ============ */
  #screen-slots{ gap:14px; padding:calc(18px + env(safe-area-inset-top,0px)) 18px 18px; }
  .panel-title{ font-family:'Press Start 2P', monospace; font-size:13px; color:var(--accent-gold); text-align:center; margin-bottom:4px; text-shadow:2px 2px 0 #000; }
  .slot{
    background:var(--parchment); color:var(--ink); border:3px solid #202020; border-radius:9px;
    box-shadow:inset 0 0 0 2px var(--parchment), inset 0 0 0 3px #6b6b7a, 0 3px 0 #000;
    padding:12px 14px; display:flex; align-items:center; gap:12px; cursor:pointer;
  }
  .slot-icon{ width:44px; height:44px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:22px; flex:none; }
  .slot-body{ flex:1; min-width:0; }
  .slot-name{ font-size:20px; font-weight:bold; }
  .slot-meta{ font-size:15px; color:#5a5a5a; }
  .slot-empty .slot-icon{ background:#e4e0d0; border:2px dashed #999; }
  .slot-filled .slot-icon{ background:linear-gradient(#fff3d0,#f2c94c); border:2px solid #b8860b; }
  .slot-del{ font-family:'Press Start 2P', monospace; font-size:8px; background:none; border:none; color:#a33323; cursor:pointer; padding:2px; }
  #back-hint{ text-align:center; margin-top:auto; padding-top:10px; }
  .ghost-btn{
    font-family:'Press Start 2P', monospace; font-size:10px; background:transparent; color:var(--parchment);
    border:2px solid var(--stone-hi); border-radius:6px; padding:8px 10px; cursor:pointer;
  }

  /* ============ CHARACTER (create/ready/preview) ============ */
  #char-preview, .char-preview-el{ width:120px; height:170px; position:relative; }
  .c-hair{ position:absolute; top:0; left:26px; width:68px; height:30px; border-radius:20px 20px 4px 4px; background:var(--hair,#5b3a29); z-index:3; }
  .c-hair.long::after{ content:""; position:absolute; top:14px; left:-6px; width:14px; height:60px; background:var(--hair,#5b3a29); border-radius:0 0 8px 8px; }
  .c-hair.long::before{ content:""; position:absolute; top:14px; right:-6px; width:14px; height:60px; background:var(--hair,#5b3a29); border-radius:0 0 8px 8px; }
  .c-head{ position:absolute; top:16px; left:34px; width:52px; height:50px; border-radius:50% 50% 46% 46%; background:var(--skin,#e8b48a); z-index:2; }
  .c-body{ position:absolute; top:60px; left:22px; width:76px; height:64px; border-radius:16px 16px 8px 8px; background:linear-gradient(var(--outfit,#6b4fc4), var(--outfit-d,#4a34a0)); z-index:1; }
  .c-body::after{ content:""; position:absolute; left:50%; top:8px; transform:translateX(-50%); width:44px; height:10px; background:var(--accent-gold); border-radius:2px; }
  .c-legs{ position:absolute; top:120px; left:30px; width:60px; height:44px; background:#2c2c40; border-radius:0 0 8px 8px; }
  .c-cape{ position:absolute; top:56px; left:12px; width:22px; height:80px; background:#141018; border-radius:4px; opacity:0; z-index:0; }
  .c-cape.on{ opacity:.95; }
  .c-crown{ position:absolute; top:-14px; left:38px; width:44px; text-align:center; font-size:26px; opacity:0; z-index:5; }
  .c-crown.on{ opacity:1; }

  #screen-create{ gap:10px; padding:calc(14px + env(safe-area-inset-top,0px)) 18px 18px; overflow-y:auto; }
  #char-preview-wrap{ display:flex; align-items:center; justify-content:center; padding:6px 0; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field-label{ font-family:'Press Start 2P', monospace; font-size:10px; color:var(--accent-gold); }
  #name-input{
    font-family:'VT323', monospace; font-size:22px; background:var(--parchment); color:var(--ink);
    border:3px solid #202020; border-radius:8px; padding:8px 10px; text-transform:uppercase;
  }
  .toggle-row{ display:flex; gap:8px; }
  .toggle-btn{
    flex:1; font-family:'Press Start 2P', monospace; font-size:10px; padding:10px 4px;
    background:#2b2740; color:var(--parchment); border:2px solid var(--stone-hi); border-radius:7px; cursor:pointer;
  }
  .toggle-btn.selected{ background:var(--accent-gold); color:#221a08; border-color:#b8860b; }
  .swatch-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .swatch{ width:32px; height:32px; border-radius:50%; border:3px solid transparent; cursor:pointer; }
  .swatch.selected{ border-color:#fff; box-shadow:0 0 0 2px #202020; }
  #create-actions{ display:flex; gap:10px; margin-top:6px; }
  .primary-btn{
    flex:1; font-family:'Press Start 2P', monospace; font-size:11px; padding:12px 8px;
    background:var(--accent-gold); color:#221a08; border:none; border-radius:7px; cursor:pointer;
  }
  .primary-btn:disabled{ background:#5a5546; color:#8a8471; cursor:default; }
  .secondary-btn{
    font-family:'Press Start 2P', monospace; font-size:11px; padding:12px 10px; background:transparent;
    color:var(--parchment); border:2px solid var(--stone-hi); border-radius:7px; cursor:pointer;
  }

  #screen-ready{ align-items:center; justify-content:center; text-align:center; gap:16px; padding:20px; }
  #ready-title{ font-family:'Press Start 2P', monospace; font-size:15px; color:var(--accent-correct); text-shadow:2px 2px 0 #000; }
  #ready-sub{ font-size:19px; color:#cfc8e0; max-width:320px; }

  /* ============ MAP ============ */
  #map-title{ text-align:center; padding:10px 12px 4px; font-family:'Press Start 2P', monospace; font-size:12px; color:var(--accent-gold); text-shadow:2px 2px 0 #000; flex:none; }
  #map-scroll{ flex:1; overflow-y:auto; overflow-x:hidden; position:relative; display:flex; flex-direction:column-reverse; }
  .zone{ position:relative; min-height:220px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .zone::before{ content:""; position:absolute; inset:0; opacity:.9; }
  .zone-1::before{ background:linear-gradient(#4a7c8c,#2f5a68 40%, #c9a55c 70%, #a8833f); }
  .zone-2::before{ background:linear-gradient(#2f6b4a,#1c4530 55%, #123322); }
  .zone-3::before{ background:linear-gradient(#6b6152,#453d32 55%, #2a251d); }
  .zone-4::before{ background:linear-gradient(#3a5f9e,#26407a 55%, #1a2c56); }
  .zone-5::before{ background:linear-gradient(#7a3f8c,#4a2560 55%, #2c1440); }
  .zone-6::before{ background:linear-gradient(#7a1f1f,#3a0e0e 55%, #1a0606); }
  .zone-label{ position:absolute; top:10px; left:50%; transform:translateX(-50%); font-family:'Press Start 2P', monospace; font-size:8px; color:rgba(255,255,255,.75); background:rgba(0,0,0,.4); padding:3px 7px; border-radius:4px; white-space:nowrap; z-index:2; }
  .path-line{ position:absolute; top:0; bottom:0; left:50%; width:4px; background:repeating-linear-gradient(#00000000 0 6px, rgba(255,255,255,.5) 6px 12px); transform:translateX(-50%); z-index:1; }
  .node{ position:relative; z-index:3; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; }
  .node.offset-l{ transform:translateX(-58px); }
  .node.offset-r{ transform:translateX(58px); }
  .node-circle{ width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; border:4px solid #fff; box-shadow:0 4px 0 rgba(0,0,0,.4), 0 0 0 4px rgba(0,0,0,.25); }
  .node.locked .node-circle{ background:#3a3a3a; border-color:#666; filter:grayscale(1); opacity:.7; }
  .node.unlocked .node-circle{ background:radial-gradient(circle at 35% 30%, #fff7d6, var(--accent-gold)); border-color:#fff; animation:pulseGlow 1.8s ease-in-out infinite; }
  .node.completed .node-circle{ background:radial-gradient(circle at 35% 30%, #d6ffe0, #4fd870); border-color:#fff; }
  @keyframes pulseGlow{ 0%,100%{ box-shadow:0 4px 0 rgba(0,0,0,.4), 0 0 0 4px rgba(242,201,76,.25); } 50%{ box-shadow:0 4px 0 rgba(0,0,0,.4), 0 0 0 10px rgba(242,201,76,.12); } }
  .node-label{ font-family:'Press Start 2P', monospace; font-size:8px; background:rgba(0,0,0,.55); padding:3px 6px; border-radius:4px; white-space:nowrap; text-align:center; }
  .node-boss .node-circle{ width:78px; height:78px; font-size:34px; }

  #sheet-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.6); display:none; align-items:flex-end; z-index:20; }
  #sheet-backdrop.show{ display:flex; }
  #sheet{ width:100%; background:var(--parchment); color:var(--ink); border-top:4px solid #202020; border-radius:14px 14px 0 0; padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:10px; }
  #sheet-title{ font-family:'Press Start 2P', monospace; font-size:14px; }
  #sheet-desc{ font-size:19px; color:#4a4a4a; }
  #sheet-progress-track{ height:12px; background:#ddd8c4; border:2px solid #202020; border-radius:6px; overflow:hidden; }
  #sheet-progress-fill{ height:100%; background:linear-gradient(#7be89a,#4fd870); }
  #sheet-progress-label{ font-size:15px; color:#5a5a5a; }
  #sheet-actions{ display:flex; gap:10px; margin-top:4px; }

  /* ============ BATTLE (first person) ============ */
  #screen-battle{ padding:0; }
  #viewport-frame{ position:relative; margin:12px 14px 8px; padding:10px; background:linear-gradient(var(--stone-mid), var(--stone-dark)); border:3px solid var(--stone-hi); box-shadow:inset 0 0 0 3px var(--stone-dark), inset 0 0 22px rgba(0,0,0,.7), 0 4px 0 #000; flex:none; }
  #viewport{ position:relative; aspect-ratio:4/3; overflow:hidden; background:radial-gradient(ellipse at 50% 30%, #2a2333, #100c16 75%); border:2px solid #000; }
  .floor{ position:absolute; left:0; right:0; bottom:0; height:30%; background:linear-gradient(#241c2c, #0c0810); }
  .torch{ position:absolute; top:14%; width:14px; height:34px; z-index:4; }
  .torch.left{ left:6%; } .torch.right{ right:6%; }
  .torch-stick{ position:absolute; bottom:0; left:50%; transform:translateX(-50%); width:6px; height:22px; background:#3a2a1a; }
  .torch-flame{ position:absolute; top:-14px; left:50%; transform:translateX(-50%); width:16px; height:20px; background:radial-gradient(circle at 50% 70%, #ffe28a, #ff9a3c 60%, transparent 75%); border-radius:50% 50% 40% 40%; animation:flicker 1.1s infinite ease-in-out alternate; filter:drop-shadow(0 0 6px #ff9a3c); }
  @keyframes flicker{ 0%{ transform:translateX(-50%) scale(1,1) rotate(-2deg); opacity:.9; } 50%{ transform:translateX(-50%) scale(0.9,1.08) rotate(2deg); opacity:1; } 100%{ transform:translateX(-50%) scale(1.05,0.95) rotate(-1deg); opacity:.85; } }
  #enemy-stage{ position:absolute; left:50%; bottom:14%; transform:translateX(-50%); width:56%; z-index:3; }
  #enemy-stage img{ width:100%; display:block; image-rendering:pixelated; filter:drop-shadow(0 10px 6px rgba(0,0,0,.55)); }
  #enemy-stage.hit{ animation:hitflash .28s steps(2); }
  @keyframes hitflash{ 0%,100%{ filter:none; } 25%,75%{ filter:brightness(3) saturate(0) drop-shadow(0 0 10px #fff); } }
  #enemy-stage.lunge{ animation:lunge .45s ease-in-out; }
  @keyframes lunge{ 0%,100%{ transform:translateX(-50%) scale(1); } 40%{ transform:translateX(-50%) scale(1.12); } }
  #enemy-stage.dissolve{ animation:dissolveOut .7s forwards; }
  @keyframes dissolveOut{ 0%{ filter:brightness(3); opacity:1; } 30%{ filter:brightness(4) saturate(0); opacity:1; transform:translateX(-50%) scale(1.06) rotate(3deg); } 100%{ filter:brightness(4) saturate(0); opacity:0; transform:translateX(-50%) scale(.4) translateY(14px) rotate(14deg); } }
  .float-num{ position:absolute; font-family:'Press Start 2P', monospace; font-size:15px; pointer-events:none; animation:floatUp 1s ease-out forwards; text-shadow:2px 2px 0 #000; z-index:10; color:#fff; }
  .float-num.heal{ color:var(--accent-correct); }
  @keyframes floatUp{ 0%{ transform:translateY(0); opacity:1; } 100%{ transform:translateY(-40px); opacity:0; } }
  #screen-hit-vignette{ position:absolute; inset:0; background:radial-gradient(ellipse at center, transparent 55%, rgba(230,60,50,.55) 130%); opacity:0; pointer-events:none; z-index:8; }
  #screen-hit-vignette.show{ animation:vignetteFlash .4s ease-out; }
  @keyframes vignetteFlash{ 0%{ opacity:0; } 25%{ opacity:1; } 100%{ opacity:0; } }
  #viewport.shake{ animation:screenShake .35s; }
  @keyframes screenShake{ 0%,100%{ transform:translate(0,0); } 20%{ transform:translate(-5px,3px); } 40%{ transform:translate(5px,-3px); } 60%{ transform:translate(-3px,2px); } 80%{ transform:translate(3px,-2px); } }
  #level-tag{ position:absolute; top:6px; left:50%; transform:translateX(-50%); font-family:'Press Start 2P', monospace; font-size:8px; color:var(--parchment); background:rgba(0,0,0,.55); padding:3px 7px; border:1px solid var(--stone-hi); z-index:6; white-space:nowrap; }

  #text-panel{ flex:1; margin:0 12px 10px; display:flex; flex-direction:column; gap:8px; overflow:hidden; padding-bottom:env(safe-area-inset-bottom,0px); min-height:0; }
  .gb-box{ background:#f8f8f0; border:3px solid #202020; border-radius:9px; box-shadow:inset 0 0 0 2px #f8f8f0, inset 0 0 0 3px #6b6b7a, 0 3px 0 #000; position:relative; }
  #dialogue-box{ padding:10px 12px; flex:none; }
  #dialogue{ font-family:'Press Start 2P', monospace; font-size:11px; line-height:20px; color:#202020; letter-spacing:.5px; }
  #answer-box{ flex:1; padding:8px 10px 10px; display:flex; flex-direction:column; gap:6px; min-height:0; overflow-y:auto; }
  #question-text{ font-family:'VT323', monospace; font-size:19px; line-height:1.25; color:#202020; border-bottom:2px solid #d8d8cc; padding-bottom:6px; }
  #options{ display:grid; grid-template-columns:1fr 1fr; gap:4px 6px; flex:1; }
  .opt-btn{ font-family:'VT323', monospace; font-size:19px; background:transparent; border:none; color:#202020; padding:4px 6px 4px 4px; cursor:pointer; text-align:left; display:flex; align-items:center; gap:4px; line-height:1.15; border-radius:5px; }
  .opt-btn .opt-arrow{ font-size:14px; color:#e6553f; width:12px; flex:none; opacity:0; }
  .opt-btn:hover:not(:disabled) .opt-arrow, .opt-btn:active:not(:disabled) .opt-arrow{ opacity:1; }
  .opt-btn:hover:not(:disabled){ background:#eae8da; }
  .opt-btn:disabled{ cursor:default; }
  .opt-btn.correct{ background:#d7f4dc; } .opt-btn.correct .opt-arrow{ opacity:1; color:#146b2c; }
  .opt-btn.wrong{ background:#f7d9d3; } .opt-btn.wrong .opt-arrow{ opacity:1; color:#9c2a1a; }
  .opt-btn.dim{ opacity:.4; }
  #consumable-row{ display:flex; gap:8px; padding:0 12px 8px; flex:none; }
  .consumable-btn{
    font-family:'Press Start 2P', monospace; font-size:9px; background:#2b2740; color:var(--parchment);
    border:2px solid var(--stone-hi); border-radius:7px; padding:6px 8px; cursor:pointer; display:flex; align-items:center; gap:5px;
  }
  .consumable-btn:disabled{ opacity:.35; cursor:default; }
  .consumable-btn .badge{ background:var(--accent-gold); color:#221a08; border-radius:4px; padding:0 4px; font-size:9px; }

  #battle-overlay{ position:absolute; inset:0; background:rgba(6,4,16,.92); display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; text-align:center; padding:24px; z-index:30; }
  #battle-overlay.show{ display:flex; }
  #battle-overlay h2{ font-family:'Press Start 2P', monospace; font-size:20px; color:var(--parchment); margin:0; }
  #battle-overlay p{ font-size:20px; color:#b8ac8e; margin:0; }

  /* ============ INVENTORY ============ */
  #preview-panel{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:3px solid var(--stone-hi); background:rgba(0,0,0,.25); flex:none; }
  #inv-char-preview{ width:88px; height:128px; position:relative; flex:none; transform:scale(0.85); transform-origin:left center; }
  #preview-info{ flex:1; min-width:0; }
  #preview-name{ font-family:'Press Start 2P', monospace; font-size:12px; color:var(--parchment); }
  #preview-level{ font-size:16px; color:#b8ac8e; margin-top:2px; }
  #equipped-tags{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .equip-tag{ font-size:13px; background:rgba(242,201,76,.15); border:1px solid var(--accent-gold); color:var(--accent-gold); padding:2px 6px; border-radius:5px; }
  #tabs{ display:flex; gap:8px; padding:10px 12px 0; flex:none; }
  .tab-btn{ flex:1; font-family:'Press Start 2P', monospace; font-size:10px; padding:10px 4px; background:transparent; color:#b8ac8e; border:2px solid var(--stone-hi); border-radius:7px 7px 0 0; cursor:pointer; border-bottom:none; }
  .tab-btn.active{ background:var(--parchment); color:var(--ink); border-color:var(--parchment); }
  #tab-content{ flex:1; overflow-y:auto; background:var(--parchment); color:var(--ink); margin:0 12px calc(12px + env(safe-area-inset-bottom,0px)); border:3px solid var(--parchment); border-top:none; border-radius:0 0 10px 10px; padding:12px; }
  .section-label{ font-family:'Press Start 2P', monospace; font-size:10px; color:#8a5a10; margin:10px 0 8px; }
  .section-label:first-child{ margin-top:0; }
  .item-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .item-card{ border:2px solid #cfc8b0; border-radius:8px; padding:10px; display:flex; flex-direction:column; gap:4px; align-items:center; text-align:center; background:#fffdf5; position:relative; }
  .item-card.equipped{ border-color:var(--accent-correct); background:#eefff2; }
  .item-icon{ font-size:30px; }
  .item-name{ font-size:16px; font-weight:bold; line-height:1.1; }
  .item-desc{ font-size:13px; color:#666; line-height:1.2; }
  .item-btn{ font-family:'Press Start 2P', monospace; font-size:9px; padding:7px 6px; border:none; border-radius:6px; cursor:pointer; background:var(--accent-gold); color:#221a08; width:100%; margin-top:4px; }
  .item-btn.equipped-btn{ background:var(--accent-correct); color:#0d2b12; }
  .item-btn:disabled{ background:#ddd8c4; color:#999; cursor:default; }
  .item-badge{ position:absolute; top:6px; right:6px; font-family:'Press Start 2P', monospace; font-size:8px; background:#202020; color:#fff; padding:2px 5px; border-radius:4px; }
  .price-tag{ font-family:'Press Start 2P', monospace; font-size:11px; color:#8a5a10; display:flex; align-items:center; gap:3px; justify-content:center; }
  .empty-msg{ text-align:center; color:#999; font-size:17px; padding:24px 10px; }
</style>
</head>
<body>
<div id="app">

  <!-- ===== TITLE ===== -->
  <div class="screen active" id="screen-title">
    <div id="stars"></div>
    <div id="logo-emblem">⚔️</div>
    <div id="logo-title">GRAMMAR<br>QUEST</div>
    <div id="logo-sub">ENGLISH RPG ADVENTURE</div>
    <div id="tap-start">TOCA PARA COMENZAR</div>
  </div>

  <!-- ===== SLOTS ===== -->
  <div class="screen" id="screen-slots">
    <div class="panel-title">ELIGE TU AVENTURA</div>
    <div id="slots-list"></div>
    <div id="back-hint"><button class="ghost-btn" id="btn-back-title">◀ VOLVER</button></div>
  </div>

  <!-- ===== CHARACTER CREATION ===== -->
  <div class="screen" id="screen-create">
    <div class="panel-title">CREA TU HÉROE</div>
    <div id="char-preview-wrap">
      <div id="char-preview">
        <div class="c-cape"></div><div class="c-legs"></div><div class="c-body"></div>
        <div class="c-head"></div><div class="c-hair" id="c-hair"></div>
      </div>
    </div>
    <div class="field"><div class="field-label">NOMBRE</div>
      <input id="name-input" maxlength="10" placeholder="ESCRIBE TU NOMBRE"></div>
    <div class="field"><div class="field-label">GÉNERO</div>
      <div class="toggle-row">
        <button class="toggle-btn selected" id="btn-boy">NIÑO</button>
        <button class="toggle-btn" id="btn-girl">NIÑA</button>
      </div></div>
    <div class="field"><div class="field-label">TONO DE PIEL</div><div class="swatch-row" id="skin-swatches"></div></div>
    <div class="field"><div class="field-label">COLOR DE CABELLO</div><div class="swatch-row" id="hair-swatches"></div></div>
    <div id="create-actions">
      <button class="secondary-btn" id="btn-cancel-create">◀ VOLVER</button>
      <button class="primary-btn" id="btn-confirm-create">CREAR HÉROE ▶</button>
    </div>
  </div>

  <!-- ===== READY ===== -->
  <div class="screen" id="screen-ready">
    <div id="ready-title">¡TU HÉROE ESTÁ LISTO!</div>
    <div id="char-preview-wrap"><div id="char-preview-ready" class="char-preview-el"></div></div>
    <div id="ready-sub">Prepárate para tu primera aventura.</div>
    <button class="primary-btn" id="btn-start-adventure" style="max-width:260px;">COMENZAR AVENTURA ▶</button>
  </div>

  <!-- ===== MAP ===== -->
  <div class="screen" id="screen-map">
    <div id="status-bar" class="map-status"></div>
    <div id="map-title">MAPA DE AVENTURA</div>
    <div id="map-scroll"></div>
    <div id="sheet-backdrop">
      <div id="sheet">
        <div id="sheet-title">—</div>
        <div id="sheet-desc">—</div>
        <div id="sheet-progress-track"><div id="sheet-progress-fill" style="width:0%"></div></div>
        <div id="sheet-progress-label">—</div>
        <div id="sheet-actions">
          <button class="secondary-btn" id="sheet-close">CERRAR</button>
          <button class="primary-btn" id="sheet-play">JUGAR ▶</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== BATTLE ===== -->
  <div class="screen" id="screen-battle">
    <div id="status-bar" class="battle-status"></div>
    <div id="viewport-frame">
      <div id="viewport">
        <div id="level-tag"></div>
        <div class="floor"></div>
        <div class="torch left"><div class="torch-stick"></div><div class="torch-flame"></div></div>
        <div class="torch right"><div class="torch-stick"></div><div class="torch-flame"></div></div>
        <div id="enemy-stage"><img id="enemy-img" src="" alt="Enemigo"></div>
        <div id="screen-hit-vignette"></div>
      </div>
    </div>
    <div id="text-panel">
      <div id="dialogue-box" class="gb-box"><div id="dialogue">—</div></div>
      <div id="answer-box" class="gb-box">
        <div id="question-text">—</div>
        <div id="options"></div>
      </div>
    </div>
    <div id="consumable-row"></div>
    <div id="battle-overlay">
      <h2 id="overlay-title">VICTORIA</h2>
      <p id="overlay-text">—</p>
      <button class="primary-btn" id="overlay-btn" style="max-width:220px;">CONTINUAR</button>
    </div>
  </div>

  <!-- ===== INVENTORY ===== -->
  <div class="screen" id="screen-inventory">
    <div id="status-bar" class="inv-status"></div>
    <div id="preview-panel">
      <div id="inv-char-preview">
        <div class="c-crown" id="inv-crown">👑</div>
        <div class="c-cape" id="inv-cape"></div>
        <div class="c-legs"></div><div class="c-body"></div><div class="c-head"></div>
        <div class="c-hair long" id="inv-hair"></div>
      </div>
      <div id="preview-info">
        <div id="preview-name">—</div>
        <div id="preview-level">—</div>
        <div id="equipped-tags"></div>
      </div>
    </div>
    <div id="tabs">
      <button class="tab-btn active" data-tab="mochila">🎒 MOCHILA</button>
      <button class="tab-btn" data-tab="tienda">🏪 TIENDA</button>
    </div>
    <div id="tab-content"></div>
  </div>

</div>

  /* ===================== STATE ===================== */
  let currentSlot = null;
  let state = null;

  function defaultState(over){
    return Object.assign({
      name:'HÉROE', gender:'boy', skin:SKIN_TONES[2], hair:HAIR_COLORS[2],
      gold:0, xp:0, maxHearts:3,
      levels:{1:{unlocked:true, completed:false, progress:0}},
      owned:[], equipped:{cape:null, crown:null}, consumables:{shield:0, flame_sword:0},
      createdAt:Date.now()
    }, over||{});
  }
  function loadSlot(n){ try{ const raw = localStorage.getItem('gq_slot_'+n); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
  function saveSlot(n, data){ try{ localStorage.setItem('gq_slot_'+n, JSON.stringify(data)); }catch(e){} }
  function deleteSlot(n){ try{ localStorage.removeItem('gq_slot_'+n); }catch(e){} }
  function persist(){ if(currentSlot) saveSlot(currentSlot, state); }

  function levelUnlockedCount(){
    let n=1; for(let i=1;i<=6;i++){ if(state.levels[i] && state.levels[i].unlocked) n=i; } return n;
  }
  function heartsForLevel(){ return Math.min(3 + Math.floor((levelUnlockedCount()-1)/2), 5); }

  /* ===================== CHARACTER PREVIEW ===================== */
  function applyPreviewColors(rootEl, cape, crown){
    rootEl.style.setProperty('--skin', state.skin);
    rootEl.style.setProperty('--hair', state.hair);
    const o = OUTFITS[state.gender];
    rootEl.style.setProperty('--outfit', o.outfit);
    rootEl.style.setProperty('--outfit-d', o.outfitD);
    const hairEl = rootEl.querySelector('[id^="c-hair"], .c-hair');
    if(hairEl) hairEl.classList.toggle('long', state.gender==='girl');
    const capeEl = rootEl.querySelector('.c-cape');
    if(capeEl) capeEl.classList.toggle('on', !!cape);
    const crownEl = rootEl.querySelector('.c-crown');
    if(crownEl) crownEl.classList.toggle('on', !!crown);
  }

  /* ===================== STATUS BAR (shared) ===================== */
  function renderStatusBar(container, showMapBtn){
    const hearts = state.maxHearts;
    let h = '';
    for(let i=0;i<hearts;i++) h += '❤️';
    const mapBtn = showMapBtn ? `<button class="icon-btn" data-nav="screen-map">🗺️</button>` : '';
    container.innerHTML = `
      <span class="hero-tag">${state.name}</span>
      <div class="hearts">${h}</div>
      <div class="status-right">
        ${mapBtn}
        <button class="icon-btn" data-nav="screen-inventory">🎒</button>
        <span class="gold">⛃ ${state.gold}</span>
        <span>XP ${state.xp}</span>
      </div>`;
    container.querySelectorAll('[data-nav]').forEach(b=>{
      b.addEventListener('click', ()=> goTo(b.dataset.nav));
    });
  }
  function goTo(screenId){
    if(screenId==='screen-map') renderMap();
    if(screenId==='screen-inventory') renderInventory();
    showScreen(screenId);
  }

  /* ===================== SLOTS SCREEN ===================== */
  function renderSlots(){
    const wrap = el('slots-list'); wrap.innerHTML = '';
    for(let i=1;i<=3;i++){
      const data = loadSlot(i);
      const div = document.createElement('div');
      if(data){
        div.className = 'slot slot-filled';
        const unlockedLvl = 1; // recomputed after load
        div.innerHTML = `
          <div class="slot-icon">${data.gender==='girl'?'👸':'🤴'}</div>
          <div class="slot-body">
            <div class="slot-name">${data.name}</div>
            <div class="slot-meta">${data.xp} XP · ⛃ ${data.gold}</div>
          </div>
          <div class="slot-actions" style="display:flex;flex-direction:column;gap:6px;">
            <span style="font-family:'Press Start 2P',monospace;font-size:9px;color:#5a8f3a;">JUGAR ▶</span>
            <button class="slot-del" data-slot="${i}">BORRAR</button>
          </div>`;
        div.addEventListener('click', (e)=>{
          if(e.target.classList.contains('slot-del')) return;
          loadIntoState(i, data);
          renderReady();
          showScreen('screen-ready');
        });
        div.querySelector('.slot-del').addEventListener('click', (e)=>{ e.stopPropagation(); deleteSlot(i); renderSlots(); });
      } else {
        div.className = 'slot slot-empty';
        div.innerHTML = `
          <div class="slot-icon">➕</div>
          <div class="slot-body">
            <div class="slot-name">SLOT ${i} — VACÍO</div>
            <div class="slot-meta">Toca para crear un nuevo héroe</div>
          </div>`;
        div.addEventListener('click', ()=> enterCreate(i));
      }
      wrap.appendChild(div);
    }
  }
  function loadIntoState(slotNum, data){ currentSlot = slotNum; state = defaultState(data); }

  /* ===================== CHARACTER CREATION ===================== */
  let draft = {};
  function buildSwatches(container, colors, key){
    container.innerHTML = '';
    colors.forEach((c)=>{
      const s = document.createElement('div');
      s.className = 'swatch' + (draft[key]===c ? ' selected' : '');
      s.style.background = c;
      s.addEventListener('click', ()=>{
        draft[key] = c;
        [...container.children].forEach(ch=>ch.classList.remove('selected'));
        s.classList.add('selected');
        state.skin = draft.skin; state.hair = draft.hair; state.gender = draft.gender;
        applyPreviewColors(el('char-preview'), false, false);
      });
      container.appendChild(s);
    });
  }
  function enterCreate(slotNum){
    currentSlot = slotNum;
    draft = { name:'', gender:'boy', skin:SKIN_TONES[2], hair:HAIR_COLORS[2] };
    state = defaultState(draft);
    el('name-input').value = '';
    el('btn-boy').classList.add('selected'); el('btn-girl').classList.remove('selected');
    buildSwatches(el('skin-swatches'), SKIN_TONES, 'skin');
    buildSwatches(el('hair-swatches'), HAIR_COLORS, 'hair');
    applyPreviewColors(el('char-preview'), false, false);
    showScreen('screen-create');
  }
  el('btn-boy').addEventListener('click', ()=>{ draft.gender='boy'; state.gender='boy'; el('btn-boy').classList.add('selected'); el('btn-girl').classList.remove('selected'); applyPreviewColors(el('char-preview'), false, false); });
  el('btn-girl').addEventListener('click', ()=>{ draft.gender='girl'; state.gender='girl'; el('btn-girl').classList.add('selected'); el('btn-boy').classList.remove('selected'); applyPreviewColors(el('char-preview'), false, false); });

  /* ===================== MAP SCREEN ===================== */
  function renderMap(){
    renderStatusBar(document.querySelector('#screen-map #status-bar'), false);
    state.maxHearts = heartsForLevel();
    const scroll = el('map-scroll');
    scroll.innerHTML = '';
    LEVELS.forEach((lvl, idx)=>{
      const lvlState = state.levels[lvl.id] || {unlocked:false, completed:false, progress:0};
      const zone = document.createElement('div');
      zone.className = 'zone zone-'+lvl.zone;
      const offsetClass = idx % 2 === 0 ? 'offset-l' : 'offset-r';
      let stateClass = 'locked';
      if(lvlState.completed) stateClass = 'completed';
      else if(lvlState.unlocked) stateClass = 'unlocked';
      zone.innerHTML = `
        <div class="zone-label">${lvl.biomeLabel}</div>
        <div class="path-line"></div>
        <div class="node ${lvl.boss?'node-boss':offsetClass} ${stateClass}" data-level="${lvl.id}">
          <div class="node-circle">${lvlState.completed ? '✅' : lvl.icon}</div>
          <div class="node-label">${lvl.boss ? 'FINAL BOSS' : 'NIVEL '+lvl.id}</div>
        </div>`;
      scroll.appendChild(zone);
    });

    scroll.querySelectorAll('.node').forEach(node=>{
      node.addEventListener('click', ()=>{
        const id = parseInt(node.dataset.level,10);
        const lvl = LEVELS.find(l=>l.id===id);
        const lvlState = state.levels[id] || {unlocked:false, completed:false, progress:0};
        el('sheet-title').textContent = lvl.name;
        el('sheet-desc').textContent = lvlState.unlocked ? lvl.desc : 'Bloqueado — completa el nivel anterior para desbloquearlo.';
        el('sheet-progress-fill').style.width = (lvlState.progress||0) + '%';
        el('sheet-progress-label').textContent = lvlState.unlocked ? (lvlState.progress||0)+'% completado' : 'Bloqueado';
        const playBtn = el('sheet-play');
        playBtn.disabled = !lvlState.unlocked;
        playBtn.textContent = !lvlState.unlocked ? '🔒 BLOQUEADO' : (lvlState.completed ? 'REPASAR ▶' : 'JUGAR ▶');
        playBtn.onclick = ()=>{ if(lvlState.unlocked){ el('sheet-backdrop').classList.remove('show'); startBattle(id); } };
        el('sheet-backdrop').classList.add('show');
      });
    });

    setTimeout(()=>{
      const current = scroll.querySelector('.node.unlocked') || scroll.querySelector('.node.completed');
      if(current) current.scrollIntoView({block:'center'});
    }, 50);
  }
  el('sheet-close').addEventListener('click', ()=> el('sheet-backdrop').classList.remove('show'));
  el('sheet-backdrop').addEventListener('click', (e)=>{ if(e.target===el('sheet-backdrop')) el('sheet-backdrop').classList.remove('show'); });

  /* ===================== BATTLE SCREEN ===================== */
  let battleLevel = null;
  let currentEnemy = null;
  let battleQuestions = [];
  const QUESTIONS_PER_BATTLE = 5;
  function shuffleArray(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }
  function sampleQuestions(bank, n){
    return shuffleArray(bank).slice(0, Math.min(n, bank.length));
  }
  let battleHearts = 0, battleQIndex = 0, battleLocked = false, battleXpGained = 0, battleGoldGained = 0;
  let flameActive = false, shieldActive = false;

  function renderBattleHearts(){
    const container = document.querySelector('#screen-battle .hearts');
    if(!container) return;
    let remaining = battleHearts, str = '';
    for(let i=0;i<state.maxHearts;i++){
      if(remaining>=2){ str+='❤️'; remaining-=2; }
      else if(remaining===1){ str+='💔'; remaining-=1; }
      else { str+='🖤'; }
    }
    container.innerHTML = str;
  }

  function startBattle(levelId){
    battleLevel = LEVELS.find(l=>l.id===levelId);
    battleQuestions = sampleQuestions(battleLevel.questions, QUESTIONS_PER_BATTLE);
    battleHearts = state.maxHearts * 2; // segments (50% per hit)
    battleQIndex = 0; battleXpGained = 0; battleGoldGained = 0;
    flameActive = false; shieldActive = false;
    renderStatusBar(document.querySelector('#screen-battle #status-bar'));
    renderBattleHearts();
    el('level-tag').textContent = battleLevel.biomeLabel;
    currentEnemy = ENEMY_ROSTER[Math.floor(Math.random()*ENEMY_ROSTER.length)];
    el('enemy-img').src = currentEnemy.img;
    el('dialogue').textContent = `¡UN ${currentEnemy.name} APARECE, BLOQUEANDO TU CAMINO!`;
    el('battle-overlay').classList.remove('show');
    renderConsumableRow();
    loadQuestion();
    showScreen('screen-battle');
  }

  function renderConsumableRow(){
    const row = el('consumable-row');
    row.innerHTML = '';
    const shieldCount = state.consumables.shield||0;
    const flameCount = state.consumables.flame_sword||0;
    const shieldBtn = document.createElement('button');
    shieldBtn.className = 'consumable-btn';
    shieldBtn.disabled = shieldCount<=0 || shieldActive;
    shieldBtn.innerHTML = `🛡️ ESCUDO ${shieldActive?'(ACTIVO)':''} <span class="badge">x${shieldCount}</span>`;
    shieldBtn.addEventListener('click', ()=>{
      if(shieldCount<=0 || shieldActive) return;
      state.consumables.shield--; shieldActive = true; persist(); renderConsumableRow();
      el('dialogue').textContent = '¡ACTIVASTE TU ESCUDO PROTECTOR!';
    });
    const flameBtn = document.createElement('button');
    flameBtn.className = 'consumable-btn';
    flameBtn.disabled = flameCount<=0 || flameActive;
    flameBtn.innerHTML = `🔥 LLAMAS ${flameActive?'(ACTIVA)':''} <span class="badge">x${flameCount}</span>`;
    flameBtn.addEventListener('click', ()=>{
      if(flameCount<=0 || flameActive) return;
      state.consumables.flame_sword--; flameActive = true; persist(); renderConsumableRow();
      el('dialogue').textContent = '¡TU ESPADA DE LLAMAS ARDE! PRÓXIMO ACIERTO x3 XP.';
    });
    row.appendChild(shieldBtn); row.appendChild(flameBtn);
  }

  function loadQuestion(){
    const item = battleQuestions[battleQIndex % battleQuestions.length];
    el('question-text').textContent = item.q;
    const opts = el('options'); opts.innerHTML = '';
    item.opts.forEach((opt,i)=>{
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span class="opt-arrow">▶</span> ${opt}`;
      btn.addEventListener('click', ()=> handleAnswer(i===item.correct, btn));
      opts.appendChild(btn);
    });
    battleLocked = false;
  }

  function floatNumber(text, cls){
    const num = document.createElement('div');
    num.className = 'float-num ' + cls; num.textContent = text;
    num.style.left = '50%'; num.style.top = '38%'; num.style.transform = 'translateX(-50%)';
    el('viewport').appendChild(num);
    setTimeout(()=>num.remove(), 1000);
  }
  function shakeScreen(){ el('viewport').classList.remove('shake'); void el('viewport').offsetWidth; el('viewport').classList.add('shake'); }
  function flashVignette(){ el('screen-hit-vignette').classList.remove('show'); void el('screen-hit-vignette').offsetWidth; el('screen-hit-vignette').classList.add('show'); }

  function handleAnswer(isCorrect, btnEl){
    if(battleLocked) return;
    battleLocked = true;
    const allBtns = [...el('options').querySelectorAll('.opt-btn')];
    allBtns.forEach(b=>{ if(b!==btnEl) b.classList.add('dim'); b.disabled = true; });
    btnEl.classList.add(isCorrect ? 'correct' : 'wrong');

    if(isCorrect){
      let gain = 20;
      if(flameActive){ gain *= 3; flameActive = false; renderConsumableRow(); }
      el('dialogue').textContent = '¡RESPUESTA CORRECTA! ATACAS AL ENEMIGO.';
      setTimeout(()=>{
        el('enemy-stage').classList.add('hit'); shakeScreen();
        floatNumber('+'+gain+'xp', 'heal');
        battleXpGained += gain; battleGoldGained += 4;
        battleQIndex++;
      }, 150);
      setTimeout(()=>{
        el('enemy-stage').classList.remove('hit');
        if(battleQIndex >= battleQuestions.length){ onVictory(); }
        else { nextTurn(); }
      }, 750);
    } else {
      if(shieldActive){
        shieldActive = false; renderConsumableRow();
        el('dialogue').textContent = '¡TU ESCUDO SE ROMPE PERO TE PROTEGE!';
        setTimeout(()=>{ shakeScreen(); }, 150);
        setTimeout(()=>{ battleQIndex++; if(battleQIndex >= battleQuestions.length){ onVictory(); } else { nextTurn(); } }, 700);
        return;
      }
      el('dialogue').textContent = '¡INCORRECTO! EL ENEMIGO TE ATACA.';
      el('enemy-stage').classList.add('lunge');
      setTimeout(()=>{
        flashVignette(); shakeScreen();
        battleHearts = Math.max(0, battleHearts-1);
        renderBattleHearts();
      }, 200);
      setTimeout(()=>{
        el('enemy-stage').classList.remove('lunge');
        if(battleHearts<=0){ onDefeat(); }
        else { battleQIndex++; if(battleQIndex >= battleQuestions.length){ onVictory(); } else { nextTurn(); } }
      }, 750);
    }
  }
  function nextTurn(){ el('dialogue').textContent = 'ELIGE LA RESPUESTA CORRECTA PARA ATACAR.'; loadQuestion(); }

  function onVictory(){
    el('enemy-stage').classList.add('dissolve');
    el('dialogue').textContent = `¡HAS DERROTADO AL ${currentEnemy.name}!`;
    setTimeout(()=>{
      state.xp += battleXpGained; state.gold += battleGoldGained;
      const lvlId = battleLevel.id;
      state.levels[lvlId] = { unlocked:true, completed:true, progress:100 };
      if(lvlId < 6){
        state.levels[lvlId+1] = state.levels[lvlId+1] || { unlocked:false, completed:false, progress:0 };
        state.levels[lvlId+1].unlocked = true;
      }
      persist();
      el('overlay-title').textContent = 'VICTORIA';
      el('overlay-text').textContent = `Ganaste ${battleXpGained} XP y ${battleGoldGained} monedas de oro.`;
      el('overlay-btn').textContent = 'VOLVER AL MAPA';
      el('overlay-btn').onclick = ()=>{ el('battle-overlay').classList.remove('show'); el('enemy-stage').classList.remove('dissolve'); goTo('screen-map'); };
      el('battle-overlay').classList.add('show');
    }, 700);
  }
  function onDefeat(){
    el('dialogue').textContent = 'HAS SIDO DERROTADO...';
    setTimeout(()=>{
      el('overlay-title').textContent = 'DERROTA';
      el('overlay-text').textContent = 'Vuelve a intentarlo cuando quieras.';
      el('overlay-btn').textContent = 'VOLVER AL MAPA';
      el('overlay-btn').onclick = ()=>{ el('battle-overlay').classList.remove('show'); goTo('screen-map'); };
      el('battle-overlay').classList.add('show');
    }, 500);
  }

  /* ===================== INVENTORY SCREEN ===================== */
  let currentTab = 'mochila';
  function renderInventory(){
    renderStatusBar(document.querySelector('#screen-inventory #status-bar'), true);
    el('preview-name').textContent = state.name;
    el('preview-level').textContent = `${state.xp} XP · ⛃ ${state.gold}`;
    applyPreviewColors(el('inv-char-preview'), state.equipped.cape, state.equipped.crown);
    const tags = el('equipped-tags'); tags.innerHTML = '';
    Object.values(state.equipped).forEach(id=>{
      if(!id) return;
      const item = ITEMS.find(i=>i.id===id);
      if(item){ const t=document.createElement('span'); t.className='equip-tag'; t.textContent=item.icon+' '+item.name; tags.appendChild(t); }
    });
    renderInvTab(currentTab);
  }
  function toggleEquip(item){
    state.equipped[item.slot] = state.equipped[item.slot]===item.id ? null : item.id;
    persist(); renderInventory();
  }
  function useConsumableFromBag(item){ /* informational only in bag view */ }
  function buyItem(item){
    if(state.gold < item.price) return;
    state.gold -= item.price;
    if(item.type==='cosmetic'){ if(!state.owned.includes(item.id)) state.owned.push(item.id); }
    else { state.consumables[item.id] = (state.consumables[item.id]||0) + 1; }
    persist(); renderInventory();
  }
  function renderInvTab(tab){
    currentTab = tab;
    document.querySelectorAll('#screen-inventory .tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
    const content = el('tab-content'); content.innerHTML = '';
    if(tab==='mochila'){
      const cosmetics = ITEMS.filter(i=>i.type==='cosmetic' && state.owned.includes(i.id));
      const consumables = ITEMS.filter(i=>i.type==='consumable' && (state.consumables[i.id]||0) > 0);
      content.innerHTML += '<div class="section-label">COSMÉTICOS</div>';
      if(cosmetics.length===0){ content.innerHTML += '<div class="empty-msg">Aún no tienes cosméticos. ¡Visita la tienda!</div>'; }
      else {
        const grid1 = document.createElement('div'); grid1.className='item-grid';
        cosmetics.forEach(item=>{
          const equipped = state.equipped[item.slot]===item.id;
          grid1.innerHTML += `<div class="item-card ${equipped?'equipped':''}">
            <div class="item-icon">${item.icon}</div><div class="item-name">${item.name}</div>
            <div class="item-desc">${item.desc}</div>
            <button class="item-btn ${equipped?'equipped-btn':''}" data-action="equip" data-id="${item.id}">${equipped?'✓ EQUIPADO':'EQUIPAR'}</button>
          </div>`;
        });
        content.appendChild(grid1);
      }
      content.innerHTML += '<div class="section-label">CONSUMIBLES</div>';
      if(consumables.length===0){ content.innerHTML += '<div class="empty-msg">No tienes consumibles. ¡Cómpralos en la tienda!</div>'; }
      else {
        const grid2 = document.createElement('div'); grid2.className='item-grid';
        consumables.forEach(item=>{
          grid2.innerHTML += `<div class="item-card">
            <div class="item-badge">x${state.consumables[item.id]}</div>
            <div class="item-icon">${item.icon}</div><div class="item-name">${item.name}</div>
            <div class="item-desc">${item.desc}</div>
            <div style="font-size:12px;color:#888;">Se usan durante la batalla</div>
          </div>`;
        });
        content.appendChild(grid2);
      }
    }
    if(tab==='tienda'){
      content.innerHTML += '<div class="section-label">COSMÉTICOS</div>';
      const grid1 = document.createElement('div'); grid1.className='item-grid';
      ITEMS.filter(i=>i.type==='cosmetic').forEach(item=>{
        const owned = state.owned.includes(item.id);
        grid1.innerHTML += `<div class="item-card">
          <div class="item-icon">${item.icon}</div><div class="item-name">${item.name}</div>
          <div class="item-desc">${item.desc}</div>
          ${owned ? `<button class="item-btn" disabled>YA LO TIENES</button>`
            : `<div class="price-tag">⛃ ${item.price}</div><button class="item-btn" data-action="buy" data-id="${item.id}" ${state.gold<item.price?'disabled':''}>COMPRAR</button>`}
        </div>`;
      });
      content.appendChild(grid1);
      content.innerHTML += '<div class="section-label">CONSUMIBLES</div>';
      const grid2 = document.createElement('div'); grid2.className='item-grid';
      ITEMS.filter(i=>i.type==='consumable').forEach(item=>{
        grid2.innerHTML += `<div class="item-card">
          ${state.consumables[item.id] ? `<div class="item-badge">x${state.consumables[item.id]}</div>` : ''}
          <div class="item-icon">${item.icon}</div><div class="item-name">${item.name}</div>
          <div class="item-desc">${item.desc}</div>
          <div class="price-tag">⛃ ${item.price}</div>
          <button class="item-btn" data-action="buy" data-id="${item.id}" ${state.gold<item.price?'disabled':''}>COMPRAR</button>
        </div>`;
      });
      content.appendChild(grid2);
    }
    content.querySelectorAll('[data-action]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const item = ITEMS.find(i=>i.id===btn.dataset.id);
        if(btn.dataset.action==='equip') toggleEquip(item);
        if(btn.dataset.action==='buy') buyItem(item);
      });
    });
  }
  document.querySelectorAll('#screen-inventory .tab-btn').forEach(b=>{
    b.addEventListener('click', ()=> renderInvTab(b.dataset.tab));
  });

  /* ===================== NAV WIRING ===================== */
  el('screen-title').addEventListener('click', ()=>{ renderSlots(); showScreen('screen-slots'); });
  el('btn-back-title').addEventListener('click', ()=> showScreen('screen-title'));

  // add "back to map" buttons dynamically on inventory/battle via status bar back icon
  function addBackButton(containerSelector, target){
    document.querySelectorAll(containerSelector).forEach(bar=>{
      if(bar.querySelector('.back-btn')) return;
    });
  }

  renderSlots();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
